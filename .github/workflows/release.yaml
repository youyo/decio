name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: youyo
          repositories: homebrew-tap
      - name: Set up mise
        uses: jdx/mise-action@v2
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: mise run release
      - name: Update major release tag
        run: |
          major_tag="${GITHUB_REF_NAME%%.*}"
          if [[ ! "$major_tag" =~ ^v[0-9]+$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          git tag -f "$major_tag" "$GITHUB_SHA"
          git push -f origin "$major_tag"
